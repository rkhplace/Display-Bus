; Firmware panel P5 64x32 untuk Smart Bus Display.
; Build: pio run   |   Upload: pio run -t upload   |   Serial: pio device monitor

[env:esp32dev]
; espressif32 6.9.0 = Arduino-ESP32 core 2.0.17 (API BLE masih memakai std::string).
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200

; BLE Bluedroid + driver DMA HUB75 tidak muat di partisi app default (1,2 MB).
board_build.partitions = huge_app.csv

build_flags =
  -DARDUINOJSON_USE_LONG_LONG=1
  -DCORE_DEBUG_LEVEL=1

lib_deps =
  mrfaptastic/ESP32 HUB75 LED MATRIX PANEL DMA Display@^3.0.12
  adafruit/Adafruit GFX Library@^1.11.11
  bblanchon/ArduinoJson@^7.2.1
